[package]
name = "vibetogether-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
agentwire = { workspace = true, features = ["client"] }
axum = { workspace = true, features = ["default"] }
base64.workspace = true
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-streamable-http-server"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json", "query"] }
agentwire-relay.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
