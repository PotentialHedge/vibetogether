[package]
name = "vibetogether-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A library for Rust, and for the web a WebAssembly module with its bindings.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
vibetogether-protocol = { path = "../protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
vibetogether-protocol = { path = "../protocol", features = ["tsify"] }
futures-util = { version = "0.3.34", default-features = false }
js-sys = "0.3.106"
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.106", features = ["AbortSignal", "Blob", "BlobPropertyBag"] }
