[package]
name = "vibetogether"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rustix = { version = "1.1.6", features = ["system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
url = "2.5.8"
vibetogether-client = { path = "../client" }
mindio = { git = "https://github.com/luiswirth/mindio", default-features = false }
vibetogether-protocol = { path = "../protocol" }

[dev-dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
vibetogether-backend = { path = "../backend" }
