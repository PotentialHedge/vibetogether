[workspace]
members = ["mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# agentwire from its repository, at the commit flake.lock and pnpm-lock.yaml pin too.
agentwire = { git = "https://github.com/PotentialHedge/agentwire", rev = "3bf9350ff3859716060079cf08c88eeb35d5cd11", default-features = false }
agentwire-relay = { git = "https://github.com/PotentialHedge/agentwire", rev = "3bf9350ff3859716060079cf08c88eeb35d5cd11" }
anyhow = "1"
axum = { version = "0.8", default-features = false }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = "3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
