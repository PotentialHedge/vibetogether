[workspace]
members = ["agentwire", "agentwire/participant", "mcp", "apps/messagent/core", "apps/messagent/claude"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agentwire = { path = "agentwire/participant", default-features = false }
agentwire-relay = { path = "agentwire" }
messagent = { path = "apps/messagent/core" }
anyhow = "1"
axum = { version = "0.8", default-features = false }
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
form_urlencoded = "1"
getrandom = "0.4"
http-body-util = "0.1"
jiff = { version = "0.2", features = ["serde"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmcp = "3.9"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
