[package]
name = "vibetogether-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
# The TypeScript declarations of every type, for the client's WebAssembly build.
tsify = ["dep:tsify", "dep:wasm-bindgen"]
