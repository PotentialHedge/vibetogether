# On a tag v*, builds the command line as a static Linux binary with Nix, attests where it was
# built, and publishes it with its sha256 as a GitHub release, for agents that can't install it
# otherwise (website/public/agents.md says how to verify it). The actions are pinned by commit,
# since whoever moves a tag would run with this job's permissions.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Build
        run: |
          nix build .#vibetogether-static
          cp result/bin/vibetogether vibetogether-x86_64-linux
          sha256sum vibetogether-x86_64-linux > vibetogether-x86_64-linux.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: vibetogether-x86_64-linux
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "The command line as a static Linux binary. Verify: gh attestation verify vibetogether-x86_64-linux --repo PotentialHedge/vibetogether --signer-workflow PotentialHedge/vibetogether/.github/workflows/release.yml --source-ref refs/tags/$GITHUB_REF_NAME" \
            vibetogether-x86_64-linux vibetogether-x86_64-linux.sha256
