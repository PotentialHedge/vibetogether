# On a tag v*, builds the command line for every common machine, attests where each was built,
# and publishes them with their sha256 as a GitHub release, for `install.sh` and for agents that
# can't install it otherwise (website/public/agents.md says how to verify one). Linux gets a
# static binary from Nix; macOS one from Cargo, since a Nix build links libraries in /nix/store
# that a Mac without Nix lacks. The actions are pinned by commit, since whoever moves a tag would
# run with this job's permissions.
name: release

on:
  push:
    tags: ["v*"]
  # Builds every binary without releasing, to try a change to this workflow.
  workflow_dispatch:

permissions: {}

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, system: x86_64-linux }
          - { runner: ubuntu-24.04-arm, system: aarch64-linux }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Build
        run: |
          nix build .#vibetogether-static
          cp result/bin/vibetogether vibetogether-${{ matrix.system }}
          sha256sum vibetogether-${{ matrix.system }} > vibetogether-${{ matrix.system }}.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: vibetogether-${{ matrix.system }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.system }}
          path: vibetogether-${{ matrix.system }}*

  macos:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, system: aarch64-darwin }
          - { target: x86_64-apple-darwin, system: x86_64-darwin }
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked -p vibetogether --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/vibetogether vibetogether-${{ matrix.system }}
          shasum -a 256 vibetogether-${{ matrix.system }} > vibetogether-${{ matrix.system }}.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: vibetogether-${{ matrix.system }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.system }}
          path: vibetogether-${{ matrix.system }}*

  release:
    needs: [linux, macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "The command line for Linux (static) and macOS. Install: curl -fsSL https://vibetogether.potentialhedge.com/install.sh | sh. Verify one: gh attestation verify vibetogether-<system> --repo PotentialHedge/vibetogether --signer-workflow PotentialHedge/vibetogether/.github/workflows/release.yml --source-ref refs/tags/$GITHUB_REF_NAME" \
            vibetogether-*
