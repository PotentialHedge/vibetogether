[workspace]
members = [".", "participant"]
resolver = "3"

[package]
name = "agentwire-relay"
version = "0.1.0"
edition = "2024"

[lib]
path = "relay/lib.rs"

[[bin]]
name = "agentwire-relay"
path = "relay/main.rs"

[dependencies]
agentwire = { path = "participant", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23"
form_urlencoded = "1"
getrandom = "0.4"
http-body-util = "0.1"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
agentwire = { path = "participant" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
