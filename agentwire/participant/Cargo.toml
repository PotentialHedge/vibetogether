[package]
name = "agentwire"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
default = ["client"]
# The HTTP client. Without it, only the types of what goes over the wire,
# as the relay uses them.
client = ["dep:reqwest"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
