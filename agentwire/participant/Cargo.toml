[package]
name = "agentwire"
version.workspace = true
edition.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["client"]
# The HTTP client. Without it, only the types of what goes over the wire,
# as the relay uses them.
client = ["dep:reqwest"]

[dependencies]
reqwest = { workspace = true, features = ["query"], optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
